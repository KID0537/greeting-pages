<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Special Greetings</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;

      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,.22), transparent 28%),
        radial-gradient(circle at 80% 70%, rgba(255,255,255,.15), transparent 25%),
        linear-gradient(135deg, #6254c7, #a65acb, #e785aa);

      color: white;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 40px 20px;
    }

    .container {
      width: min(900px, 100%);
      text-align: center;
    }

    .subtitle {
      letter-spacing: 4px;
      font-size: 13px;
      opacity: .75;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-size: clamp(42px, 7vw, 72px);
    }

    .description {
      margin: 15px 0 40px;
      font-size: 17px;
      opacity: .85;
    }

    .grid {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 22px;
    }

    .card {
      text-decoration: none;
      color: white;

      padding: 38px 25px;

      border-radius: 24px;

      background: rgba(255,255,255,.14);

      border: 1px solid rgba(255,255,255,.25);

      backdrop-filter: blur(16px);

      box-shadow:
        0 18px 45px rgba(0,0,0,.17);

      transition:
        transform .25s ease,
        background .25s ease,
        box-shadow .25s ease;
    }

    .card:hover {
      transform: translateY(-7px);

      background: rgba(255,255,255,.20);

      box-shadow:
        0 25px 55px rgba(0,0,0,.23);
    }

    .icon {
      font-size: 52px;
      margin-bottom: 14px;
    }

    .title {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .text {
      font-size: 14px;
      opacity: .76;
    }

    .footer {
      margin-top: 35px;
      font-size: 13px;
      opacity: .6;
    }

    @media (max-width: 650px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="subtitle">
      SPECIAL GREETINGS
    </div>

    <h1>
      一些特别的日子 ✨
    </h1>

    <div class="description">
      为值得纪念的时刻，留下一点特别的仪式感。
    </div>

    <div class="grid">

      <a class="card" href="./birthday.html">

        <div class="icon">
          🎂
        </div>

        <div class="title">
          生日快乐
        </div>

        <div class="text">
          Happy Birthday
        </div>

      </a>


      <a class="card" href="./shufe-school.html">

        <div class="icon">
          🎓
        </div>

        <div class="title">
          恭喜开学 · 上财
        </div>

        <div class="text">
          A new chapter begins
        </div>

      </a>


      <a class="card" href="./mid-autumn.html">

        <div class="icon">
          🌕
        </div>

        <div class="title">
          中秋快乐
        </div>

        <div class="text">
          月色正好，人间团圆
        </div>

      </a>


      <a class="card" href="./national-day.html">

        <div class="icon">
          🇨🇳
        </div>

        <div class="title">
          国庆快乐
        </div>

        <div class="text">
          山河锦绣，岁月长安
        </div>

      </a>

    </div>

    <div class="footer">
      Made with a little bit of care ✦
    </div>

  </main>

</body>
</html>
