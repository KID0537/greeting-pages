<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>国庆快乐</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {

      margin: 0;

      min-height: 100vh;

      font-family:
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;

      background:
        radial-gradient(circle at 50% -10%, #ffdf70, transparent 30%),
        linear-gradient(160deg, #8f001b, #c8102e 55%, #7d0016);

      color: white;

      display: flex;

      align-items: center;
      justify-content: center;

      padding: 30px;

    }

    .card {

      width: min(820px, 100%);

      padding: 55px 42px;

      border-radius: 28px;

      background: rgba(255,255,255,.10);

      border: 1px solid rgba(255,255,255,.24);

      backdrop-filter: blur(18px);

      box-shadow:
        0 30px 80px rgba(0,0,0,.28);

      text-align: center;

    }

    .flag {

      font-size: 72px;

      margin-bottom: 15px;

      animation: float 3s ease-in-out infinite;

    }

    @keyframes float {

      50% {
        transform: translateY(-8px);
      }

    }

    .small {

      letter-spacing: 5px;

      font-size: 13px;

      color: #ffe29a;

    }

    h1 {

      margin: 15px 0;

      font-size: clamp(48px, 8vw, 82px);

      color: #fff6d2;

      text-shadow:
        0 6px 25px rgba(0,0,0,.25);

    }

    .subtitle {

      font-size: 20px;

      margin-bottom: 30px;

      opacity: .9;

    }

    .message {

      padding: 27px;

      border-radius: 20px;

      background:
        rgba(255,255,255,.09);

      line-height: 2.1;

      font-size: 18px;

      text-align: left;

    }

    .footer {

      margin-top: 28px;

      letter-spacing: 2px;

      color: #ffe29a;

    }

  </style>

</head>

<body>

  <main class="card">

    <div class="flag">
      🇨🇳
    </div>

    <div class="small">
      NATIONAL DAY
    </div>

    <h1>
      国庆快乐
    </h1>

    <div class="subtitle">
      山河锦绣 · 岁月长安
    </div>

    <div class="message">

      十月的风，
      带着秋日的清朗，
      也带来了属于这个假期的轻松与热烈。

      <br><br>

      愿你暂时放下忙碌，
      去看看山河，
      去见想见的人，
      去过几天真正属于自己的生活。

      <br><br>

      愿家国安宁，
      岁月静好。

      <br>

      也愿你一路有风景，
      前方皆坦途。

      <br><br>

      国庆快乐！🎉

    </div>

    <div class="footer">
      ✦ 盛世华章 · 山河无恙 ✦
    </div>

  </main>

</body>
</html>
